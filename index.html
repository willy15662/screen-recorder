<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob:; media-src 'self' blob:; connect-src 'self' http://127.0.0.1:*;">
  <title>桌面錄影室</title>
  <link rel="stylesheet" href="studio.css">
</head>
<body>
  <header>
    <strong><i></i> 桌面錄影室</strong>
    <nav>
      <button id="captureTab" aria-pressed="true">錄製</button>
      <button id="libraryTab" aria-pressed="false">媒體庫</button>
    </nav>
  </header>

  <main id="studio">
    <section class="workspace">
      <div class="bar">
        <h1>擷取畫面</h1>
        <button id="source">選擇或更換來源</button>
      </div>

      <div class="stage">
        <div id="hint">
          <b>選擇要擷取的畫面</b>
          <p>分享螢幕、視窗或分頁後，可拖曳框選錄製範圍。</p>
          <button id="pick">選擇畫面</button>
        </div>
        <div class="frame" id="frame">
          <video id="preview" muted autoplay playsinline></video>
          <canvas id="still" hidden></canvas>
          <canvas id="ink"></canvas>
          <div id="box" hidden></div>
        </div>
        <div id="areaTools" hidden>
          <span>拖曳選取錄影範圍</span>
          <button id="areaDone">套用範圍</button>
          <button id="areaCancel">取消</button>
        </div>
      </div>

      <div class="bar tools">
        <span id="dimensions">尚未選取來源</span>
        <div class="tool-group">
          <button id="expand" disabled>框選錄影區域</button>
          <button id="pen" disabled aria-pressed="false">畫筆</button>
          <input id="penColor" type="color" value="#ff574f" title="畫筆顏色" disabled>
          <button id="undoInk" disabled>復原筆跡</button>
          <button id="erase" disabled>清除筆跡</button>
          <button id="full" disabled>重設為全畫面</button>
        </div>
      </div>
    </section>

    <aside>
      <h2>錄製設定</h2>
      <label>系統聲音<input id="system" type="checkbox" checked></label>
      <label>麥克風<input id="mic" type="checkbox"></label>
      <div id="micRow" class="sub-setting" hidden>
        <select id="micDevice" aria-label="麥克風裝置"></select>
        <div class="meter" title="麥克風音量"><span id="micBar"></span></div>
      </div>
      <label>攝影機小窗<input id="cam" type="checkbox"></label>
      <div id="camRow" class="sub-setting" hidden>
        <select id="camDevice" aria-label="攝影機裝置"></select>
      </div>
      <label>小窗位置
        <select id="corner">
          <option value="right">右下</option>
          <option value="left">左下</option>
        </select>
      </label>
      <label>畫質
        <select id="quality">
          <option value="5000000" selected>標準 (5 Mbps)</option>
          <option value="12000000">高畫質 (12 Mbps)</option>
          <option value="2500000">省空間 (2.5 Mbps)</option>
        </select>
      </label>
      <label>影格率
        <select id="fps">
          <option value="30">30</option>
          <option value="60">60</option>
          <option value="15">15</option>
        </select>
      </label>
      <label>開始倒數
        <select id="delay">
          <option value="0">關閉</option>
          <option value="3">3 秒</option>
          <option value="5">5 秒</option>
        </select>
      </label>
      <label>自動停止
        <select id="limit">
          <option value="0">手動</option>
          <option value="60">1 分鐘</option>
          <option value="300">5 分鐘</option>
          <option value="900">15 分鐘</option>
          <option value="3600">1 小時</option>
        </select>
      </label>
      <label>錄影時開浮動列<input id="autoFloat" type="checkbox"></label>
      <button id="float">浮動控制列 ↗</button>
    </aside>

    <section class="transport">
      <output id="clock">00:00:00</output>
      <button id="record" disabled>● 開始錄影</button>
      <button id="pause" disabled>暫停</button>
      <button id="stop" disabled>停止</button>
      <button id="shot" disabled>截圖</button>
    </section>
  </main>

  <main id="library" hidden>
    <div class="bar">
      <h1>本機媒體庫</h1>
      <div class="tool-group">
        <span id="storageInfo" class="muted"></span>
        <button id="openMedia">開啟磁碟檔案</button>
        <input id="mediaInput" type="file" accept=".mp4,.png" hidden>
        <button id="clearAll" hidden>清空媒體庫</button>
        <button id="back">返回錄製</button>
      </div>
    </div>

    <div class="folder-settings">
      <div>
        <small>新錄影與截圖的儲存位置</small>
        <div id="folderPath">讀取中…</div>
      </div>
      <button id="folderOpen">開啟資料夾</button>
      <button id="folderChoose">變更儲存位置</button>
    </div>

    <div class="collection">
      <div id="items"></div>
      <section id="viewer">
        <p id="empty">錄影和截圖會出現在這裡。</p>
        <video id="playback" controls hidden></video>
        <img id="photo" hidden alt="截圖預覽">
        <div id="trimBar" class="trim-bar" hidden>
          <label>開始 (秒)<input id="trimStart" type="number" min="0" step="0.1" value="0"></label>
          <label>結束 (秒)<input id="trimEnd" type="number" min="0" step="0.1" value="0"></label>
          <button id="trimExport">匯出裁切片段</button>
        </div>
        <div class="bar viewer-actions">
          <button id="copyImage" hidden>複製截圖</button>
          <a id="download" hidden>另存檔案</a>
          <button id="remove" hidden>刪除</button>
        </div>
      </section>
    </div>
  </main>

  <footer>
    <span id="msg" role="status">準備就緒</span>
    <small>視窗內 F8 暫停／繼續 · F9 停止 · Esc 取消倒數</small>
  </footer>

  <script defer src="vendor/mediabunny-1.29.1.js"></script>
  <script defer src="mp4.js"></script>
  <script defer src="storage.js"></script>
  <script defer src="folders.js"></script>
  <script defer src="recorder.js"></script>
  <script defer src="studio.js"></script>
</body>
</html>
